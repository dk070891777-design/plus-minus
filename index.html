<style>
:root{
  --bg:#F1F1F3; --surface:#FFFFFF; --surface-2:#E8E9EC; --ink:#17191D; --ink-2:#4A4E56; --muted:#767B84;
  --line:#DCDEE2; --accent:#23262B; --accent-2:#23262B; --accent-ink:#FFFFFF; --accent-soft:#E8E9EC;
  --bar:#2B2E34; --bar-dim:#C3C6CC; --good:#1B8452; --good-soft:#DCF0E4; --bad:#C3342D; --bad-soft:#F8E0DE; --warn:#A8690F;
  --shadow:0 1px 2px rgba(20,22,26,.05),0 6px 20px rgba(20,22,26,.06); --chip:16%;
  --r:18px; --display:"Unbounded","Onest",system-ui,sans-serif; --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E0F11; --surface:#18191C; --surface-2:#232529; --ink:#ECEDEF; --ink-2:#B4B8BE; --muted:#80858D;
    --line:#2C2F34; --accent:#D9DCE0; --accent-2:#ECEDEF; --accent-ink:#141518; --accent-soft:#2A2D32;
    --bar:#D9DCE0; --bar-dim:#4B4F56; --good:#4CC486; --good-soft:#173524; --bad:#F07068; --bad-soft:#3B1F1D; --warn:#E3AA4F;
    --shadow:0 1px 2px rgba(0,0,0,.35); --chip:24%;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
    --bg:#0E0F11; --surface:#18191C; --surface-2:#232529; --ink:#ECEDEF; --ink-2:#B4B8BE; --muted:#80858D;
    --line:#2C2F34; --accent:#D9DCE0; --accent-2:#ECEDEF; --accent-ink:#141518; --accent-soft:#2A2D32;
    --bar:#D9DCE0; --bar-dim:#4B4F56; --good:#4CC486; --good-soft:#173524; --bad:#F07068; --bad-soft:#3B1F1D; --warn:#E3AA4F;
    --shadow:0 1px 2px rgba(0,0,0,.35); --chip:24%;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ms{display:inline-block;width:1em;height:1em;font-size:22px;fill:currentColor;flex:none;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}
.app{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 10px}
.brand{font:600 17px/1 var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;display:block;flex:none}
.brand .pm{font:600 22px/1 var(--display);letter-spacing:.02em;white-space:nowrap}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.month b{font-weight:600;min-width:118px;text-align:center;font-size:14px}
.month button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.month button:disabled{opacity:.3;cursor:default}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font:600 13px/1.2 var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 a,.linkbtn{font:600 13px/1 var(--body);text-transform:none;letter-spacing:0;color:var(--accent);cursor:pointer}

/* hero */
.hero{background:linear-gradient(160deg,#3A3D44 0%,#23252A 55%,#1A1B1F 100%);color:#F4F5F7;box-shadow:0 10px 30px rgba(20,22,26,.18)}
.hero .label{color:rgba(244,245,247,.7);font-size:14px}
.hero .linkbtn{color:#fff;text-decoration:underline}
.hero .meta{color:rgba(244,245,247,.75)}
.hero .meta b{color:#fff}
.hero .meter{background:rgba(255,255,255,.14)}
.hero .meter i{background:linear-gradient(90deg,#BFC3C9,#F4F5F7)}
.hero .meter i.over{background:#FF7A70}
.hero .meter .pace{background:#fff;opacity:.9}
.hero .pill{background:rgba(255,255,255,.12);color:#fff}
.hero .pill.bad{background:rgba(255,110,100,.22);color:#FFC2BD}
.hero .inc{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;color:rgba(244,245,247,.75)}
.hero .inc b{color:#fff}
.hero .big{font:600 clamp(34px,10vw,44px)/1.05 var(--display);letter-spacing:-.03em;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:.5em;color:var(--muted);margin-left:4px}
.meter{position:relative;height:12px;border-radius:99px;background:var(--surface-2);overflow:visible}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.meter i.over{background:var(--bad)}
.meter .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;opacity:.55}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill .ms{font-size:16px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);min-width:0}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{display:block;font:600 16px/1.2 var(--display);margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.tiles.two{grid-template-columns:repeat(2,1fr)}

/* category rows */
.cats{display:flex;flex-direction:column;gap:14px}
.crow{display:grid;grid-template-columns:38px 1fr auto;gap:4px 10px;align-items:center;width:100%;text-align:left;border-radius:12px;padding:4px;margin:-4px}
button.crow:hover{background:var(--surface-2)}
.ic{--cc:#7C838C;width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--cc) var(--chip),var(--surface));color:var(--cc);display:grid;place-items:center;flex:none}
.crow .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .am{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.crow .sub{grid-column:2/4;display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:-2px}
.crow .track{grid-column:2/4;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.crow .track i{display:block;height:100%;border-radius:9px;background:var(--cc,var(--bar))}
.crow .track i.over{background:var(--bad)}
.up{color:var(--bad)} .down{color:var(--good)}

/* list */
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;padding:14px 2px 6px}
.day:first-child{padding-top:0}
.row{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:8px 2px;width:100%;text-align:left;border-radius:12px}
.row:hover{background:var(--surface-2)}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .v.plus{color:var(--good)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty .ms{font-size:36px;color:var(--bar-dim);display:block;margin:0 auto 8px}

.banner{display:flex;gap:12px;align-items:flex-start;background:var(--surface);box-shadow:var(--shadow);color:var(--ink-2);border-radius:14px;padding:12px 14px;font-size:14px}
.banner b{color:var(--ink)}
.banner p{margin:0;color:var(--ink-2)}
.banner .linkbtn{margin-top:6px;display:inline-block}

/* charts */
.chart{width:100%;overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--body);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .avg{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 4}
.chart .b{fill:var(--bar-dim)}
.chart .b.on{fill:var(--bar)}
.chart .hit{fill:transparent;cursor:pointer}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;margin-bottom:8px;min-height:22px}
.readout b{font-weight:700;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;vertical-align:middle;margin-right:5px}
.legend .lb{height:8px;border-radius:2px;background:var(--bar)}
.legend .la{height:0;border-top:2px dashed var(--ink-2)}

.insights{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.insights li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.insights .ms{color:var(--accent);font-size:20px;margin-top:1px}

/* history tools */
.tools{display:flex;gap:8px}
.field{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 12px;box-shadow:var(--shadow);min-width:0}
.field input{border:0;background:none;outline:none;height:44px;width:100%;min-width:0}
select.sel{height:44px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);padding:0 10px;max-width:44%}

/* settings */
.set{display:flex;flex-direction:column;gap:10px}
.inrow{display:flex;gap:8px;align-items:center}
.inp{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;width:100%;min-width:0}
.btn{height:44px;border-radius:12px;padding:0 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lim{display:grid;grid-template-columns:32px 1fr 110px;gap:10px;align-items:center}
.lim .ic{width:32px;height:32px;border-radius:10px}
.lim .ic .ms{font-size:18px}
.lim input{height:38px}
.note{font-size:13px;color:var(--muted);margin:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.status{display:flex;gap:10px;align-items:center;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:64px}
.nav button.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);height:100%;justify-content:center}
.nav button.tab.on{color:var(--accent)}
.fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(160deg,#44474E,#1C1E22);color:#fff;display:grid;place-items:center;margin:0 auto;transform:translateY(-14px);box-shadow:0 8px 20px rgba(20,22,26,.35)}
.fab .ms{font-size:32px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(8,14,11,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:540px;max-height:96%;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet.anim{animation:up .22s ease-out}
  .sheet>*{flex-shrink:0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet.anim{animation:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{height:36px;border-radius:10px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.amt{font:600 40px/1.1 var(--display);text-align:center;letter-spacing:-.03em;font-variant-numeric:tabular-nums;padding-block:4px;overflow-wrap:anywhere}
.amt.zero{color:var(--muted)}
.amt.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;font-size:11px;line-height:1.15;color:var(--ink-2);text-align:center;border:1.5px solid transparent;min-width:0}
.cbtn .ic{width:36px;height:36px;border-radius:11px}
.cbtn.on{border-color:var(--ink);background:var(--surface-2);color:var(--ink)}
.cbtn.on .ic{background:var(--cc);color:#fff}
.cgrid.need{outline:2px dashed var(--bad);outline-offset:4px;border-radius:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{height:34px;padding:0 12px;border-radius:99px;background:var(--surface-2);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--surface)}
.dstep{display:inline-flex;align-items:center;height:34px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);font-size:13.5px}
.dstep b{font-weight:600;padding:0 2px;white-space:nowrap}
.dstep button{width:32px;height:34px;display:grid;place-items:center;color:inherit}
.dstep button:disabled{opacity:.3}
.dstep.on{background:var(--ink);color:var(--surface)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{height:50px;border-radius:12px;background:var(--surface-2);font:600 20px/1 var(--display)}
.keys button:active{background:var(--line)}
.save{height:52px;font-size:16px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;min-height:17px;margin:-4px 0}
.hint.err{color:var(--bad)}

.tpl{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tpl::-webkit-scrollbar{display:none}
.tpl .chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.tpl .chip i{width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none}
.sum{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.sum li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.sum li .ms{font-size:20px;margin-top:1px}
.sum .g{color:var(--good)} .sum .r{color:var(--bad)} .sum .n{color:var(--ink-2)}
.about{display:flex;gap:16px;align-items:center}
.about svg{width:64px;height:64px;flex:none}
.about b{font:600 26px/1 var(--display)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.toast button{color:var(--bar-dim);font-weight:700}
</style>

 {id:'incother',col:'#7C838C',n:'Інший дохід',i:'savings',k:[]}
];
const ALL=[...CATS,...INCS];
const cat=id=>ALL.find(c=>c.id===id)||CATS[CATS.length-1];
const MN=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const MG=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const ML=['у січні','у лютому','у березні','у квітні','у травні','у червні','у липні','у серпні','у вересні','у жовтні','у листопаді','у грудні'];
const MS=['січ','лют','бер','квіт','трав','черв','лип','серп','вер','жовт','лист','груд'];
const WD=['неділя','понеділок','вівторок','середа','четвер','пʼятниця','субота'];

/* ---------- утиліти ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dstr=t=>`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
const today=()=>dstr(new Date());
const ymNow=()=>today().slice(0,7);
const dim=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const addM=(ym,k)=>{let[y,m]=ym.split('-').map(Number);m+=k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return`${y}-${pad(m)}`};
const mIdx=ym=>Number(ym.slice(5,7))-1;
const nf=new Intl.NumberFormat('uk-UA',{maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('uk-UA',{maximumFractionDigits:0});
const money=v=>nf.format(Math.round(v*100)/100)+' ₴';
const money0=v=>nf0.format(Math.round(v))+' ₴';
const short=v=>v>=1000?(Math.round(v/100)/10).toString().replace('.',',')+' тис':String(Math.round(v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayLabel=d=>{const t=today();const y=dstr(new Date(Date.now()-864e5));const[, m,dd]=d.split('-').map(Number);const wd=WD[new Date(d+'T12:00').getDay()];
  if(d===t)return'Сьогодні';if(d===y)return'Вчора';return`${dd} ${MG[m-1]}, ${wd}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const icon=(c,sz)=>`<span class="ic" style="--cc:${c.col}"><svg class="ms"${sz?` style="font-size:${sz}px"`:''} aria-hidden="true"><use href="#i-${c.i}"></use></svg></span>`;
function guess(note,type){const s=' '+String(note||'').toLowerCase()+' ';const list=type==='i'?INCS:CATS;let best=null,bl=0;
  for(const c of list)for(const k of c.k)if(k.length>bl&&s.includes(k)){best=c.id;bl=k.length}return best}

/* ---------- стан ---------- */
const S={months:{},settings:{budget:0,limits:{},demoOff:false},mode:'connecting',unsynced:[],
  view:'home',month:ymNow(),selDay:null,selTrend:null,q:'',qcat:''};
const LS='kopiyka.v1';
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(LS)||'null');if(r){S.months=r.months||{};S.settings=Object.assign(S.settings,r.settings||{});S.unsynced=r.unsynced||[]}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({months:S.months,settings:S.settings,unsynced:S.unsynced}))}catch(e){}}
const hasReal=()=>Object.values(S.months).some(a=>a&&a.length);
const isDemo=()=>!hasReal()&&!S.settings.demoOff;

/* приклад даних (показується, поки немає власних записів) */
let DEMO=null;
function buildDemo(){let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const rnd=(a,b)=>Math.round((a+r()*(b-a))/5)*5;const months={};const cur=ymNow();const td=Number(today().slice(8));
  for(let k=5;k>=0;k--){const ym=addM(cur,-k);const last=k===0?td:dim(ym);const it=[];
    const add=(d,t,c,a,n)=>it.push({id:'demo'+ym+d+it.length,t,c,a,n,d:`${ym}-${pad(d)}`});
    for(let d=1;d<=last;d++){const wd=new Date(`${ym}-${pad(d)}T12:00`).getDay();const we=wd===0||wd===6;
      if(r()<.62)add(d,'e','food',rnd(120,we?1400:700),['АТБ','Сільпо','Ринок','Фора'][Math.floor(r()*4)]);
      if(r()<(we?.6:.3))add(d,'e','cafe',rnd(90,we?900:350),we?'Вечеря':'Кава');
      if(d%6===2)add(d,'e','car',rnd(700,1600),'Заправка');
      if(r()<.25)add(d,'e','trans',rnd(30,260),'Таксі');
      if(d===10)add(d,'e','home',rnd(2600,3400),'Комуналка');
      if(d===4)add(d,'e','net',250,'Київстар');
      if(r()<.1)add(d,'e','fun',rnd(150,600),'Кіно');
      if(r()<.06)add(d,'e','health',rnd(150,900),'Аптека');
      if(r()<.04)add(d,'e','wear',rnd(700,2600),'Кросівки');
      if(r()<.05)add(d,'e','gift',rnd(300,1200),'Подарунок');
      if(d===5)add(d,'i','salary',32000,'Зарплата');
      if(d===20)add(d,'i','salary',14000,'Аванс');
    }
    months[ym]=it}
  return{months,settings:{budget:30000,limits:{food:9000,cafe:3500}}}}
const src=()=>isDemo()?(DEMO||(DEMO=buildDemo())):S;
const items=ym=>(src().months[ym]||[]);
const budget=()=>Number(src().settings.budget)||0;
const limits=()=>src().settings.limits||{};

/* ---------- підрахунки ---------- */
function isCur(ym){return ym===ymNow()}
function elapsed(ym){const c=ymNow();if(ym<c)return dim(ym);if(ym>c)return 0;return Number(today().slice(8))}
function stats(ym,upto){const n=dim(ym);const o={exp:0,inc:0,cat:{},cnt:{},day:Array(n).fill(0),n:0,list:[]};
  for(const x of items(ym)){const d=Number(x.d.slice(8));if(upto&&d>upto)continue;
    if(x.t==='i'){o.inc+=x.a;continue}
    o.exp+=x.a;o.n++;o.cat[x.c]=(o.cat[x.c]||0)+x.a;o.cnt[x.c]=(o.cnt[x.c]||0)+1;o.day[d-1]+=x.a;o.list.push(x)}
  return o}
function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=v)return m*p;return 10*p}
function sortedItems(ym){return[...items(ym)].sort((a,b)=>b.d.localeCompare(a.d)||(b.ts||0)-(a.ts||0))}

/* ---------- рендер ---------- */
function render(){
  const ym=S.month;$('#mLabel').textContent=`${MN[mIdx(ym)]} ${ym.slice(0,4)}`;
  $('#mNext').disabled=ym>=ymNow();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.view));
  const v=$('#view');
  v.innerHTML=({home:vHome,list:vList,stats:vStats,set:vSet})[S.view]();
  if(S.view==='stats')drawCharts();
}
function safeRender(){if(document.activeElement&&document.activeElement.matches('#view input'))return;render()}
function demoBanner(){return isDemo()?`<div class="banner"><svg class="ms" aria-hidden="true"><use href="#i-visibility"></use></svg><div><b>Це приклад, щоб було видно, як усе працює.</b>
  <p>Додайте першу власну витрату кнопкою «+», і приклад зникне сам.</p><button class="linkbtn" data-act="hideDemo">Сховати приклад зараз</button></div></div>`:''}

function vHome(){const ym=S.month,st=stats(ym),b=budget(),n=dim(ym),el=elapsed(ym);
  let hero=`<section class="card hero"><div class="label">Витрачено ${ML[mIdx(ym)]}</div><div class="big">${money0(st.exp)}</div>`;
  if(b>0){const p=Math.min(st.exp/b,1)*100;const over=st.exp>b;const pace=isCur(ym)?el/n*100:null;
    const left=b-st.exp;const dl=isCur(ym)?n-el+1:0;
    const ahead=pace!=null&&st.exp>b*el/n*1.05;
    hero+=`<div class="meter" role="img" aria-label="Витрачено ${Math.round(st.exp/b*100)}% бюджету"><i class="${over?'over':''}" style="width:${p}%"></i>${pace!=null?`<span class="pace" style="left:${pace}%" title="Де варто бути сьогодні"></span>`:''}</div>
    <div class="meta"><span>${over?`Перевищено на <b class="num">${money0(-left)}</b>`:`Залишилось <b class="num">${money0(left)}</b> з ${money0(b)}`}</span>
    ${isCur(ym)&&!over&&dl>0?`<span>≈ <b class="num">${money0(left/dl)}</b> на день</span>`:''}</div>
    ${isCur(ym)?`<div style="margin-top:10px">${over||ahead?`<span class="pill bad"><svg class="ms" aria-hidden="true"><use href="#i-trending_up"></use></svg>Витрачаєте швидше за план</span>`:`<span class="pill"><svg class="ms" aria-hidden="true"><use href="#i-check_circle"></use></svg>У межах плану</span>`}</div>`:''}`;
  }else hero+=`<div class="meta"><span>Бюджет на місяць не задано</span><button class="linkbtn" data-act="go" data-v="set">Задати бюджет</button></div>`;
  if(st.inc>0){const bal=st.inc-st.exp;hero+=`<div class="inc"><span>Доходи <b class="num">${money0(st.inc)}</b></span><span>Різниця <b class="num">${bal<0?'−':'+'}${money0(Math.abs(bal))}</b></span></div>`}
  hero+='</section>';
  const L=limits();const warn=Object.entries(L).filter(([id,l])=>l>0&&(st.cat[id]||0)>=l*.8).sort((a,b)=>(st.cat[b[0]]||0)/b[1]-(st.cat[a[0]]||0)/a[1]);
  const lim=warn.length?`<section class="card"><h2>Ліміти, на які варто зважати</h2><div class="cats">${warn.map(([id,l])=>{const c=cat(id),v=st.cat[id]||0,over=v>l;return`<button class="crow" data-act="drill" data-c="${id}" style="--cc:${c.col}">${icon(c)}<span class="nm">${c.n}</span><span class="am">${Math.round(v/l*100)}%</span><span class="track"><i class="${over?'over':''}" style="width:${Math.min(v/l,1)*100}%"></i></span><span class="sub"><span>${money0(v)} з ${money0(l)}</span><span class="${over?'up':''}">${over?'перевищено на '+money0(v-l):'залишилось '+money0(l-v)}</span></span></button>`}).join('')}</div></section>`:'';
  const avg=el?st.exp/el:0;const todaySum=isCur(ym)?st.day[el-1]||0:0;
  const tiles=`<div class="tiles">${isCur(ym)?`<div class="tile"><span>Сьогодні</span><b>${money0(todaySum)}</b></div>`:`<div class="tile"><span>Записів</span><b>${st.n}</b></div>`}
    <div class="tile"><span>Середнє/день</span><b>${money0(avg)}</b></div>
    ${isCur(ym)?`<div class="tile"><span>Прогноз на місяць</span><b>${money0(avg*n)}</b></div>`:`<div class="tile"><span>Доходи</span><b>${money0(st.inc)}</b></div>`}</div>`;
  const top=Object.entries(st.cat).sort((a,b)=>b[1]-a[1]).slice(0,4);const mx=top[0]?top[0][1]:1;
  const cats=`<section class="card"><h2>Куди йдуть гроші <a data-act="go" data-v="stats">Уся аналітика</a></h2>${top.length?`<div class="cats">${top.map(([id,s])=>{const c=cat(id);return`<button class="crow" data-act="drill" data-c="${id}" style="--cc:${c.col}">${icon(c)}<span class="nm">${c.n}</span><span class="am">${money0(s)}</span><span class="track"><i style="width:${s/mx*100}%"></i></span><span class="sub"><span>${st.cnt[id]} ${plural(st.cnt[id],'запис','записи','записів')}</span><span>${Math.round(s/st.exp*100)}%</span></span></button>`}).join('')}</div>`:emptyBox('pie_chart','Тут з’явиться розподіл витрат за категоріями')}</section>`;
  const rec=sortedItems(ym).slice(0,6);
  const recent=`<section class="card"><h2>Останні записи <a data-act="go" data-v="list">Уся історія</a></h2>${rec.length?rec.map(rowHtml).join(''):emptyBox('edit_note','Записів ще немає. Натисніть «+», щоб додати першу витрату')}</section>`;
  return demoBanner()+hero+lim+tiles+cats+recent}
function plural(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<12||m100>14))return b;return c}
function emptyBox(ic,t){return`<div class="empty"><svg class="ms" aria-hidden="true"><use href="#i-${ic}"></use></svg>${t}</div>`}
function rowHtml(x){const c=cat(x.c);const sub=x.n?esc(x.n):'';return`<button class="row" data-act="edit" data-id="${esc(x.id)}">${icon(c)}<span class="t"><b>${sub||c.n}</b><span>${sub?c.n+' · ':''}${dayLabel(x.d)}</span></span><span class="v${x.t==='i'?' plus':''}">${x.t==='i'?'+':'−'}${money(x.a)}</span></button>`}

function vList(){let list;const q=S.q.trim().toLowerCase();
  if(q){list=Object.keys(src().months).flatMap(k=>items(k))}else list=items(S.month);
  list=list.filter(x=>(!S.qcat||x.c===S.qcat)&&(!q||(x.n||'').toLowerCase().includes(q)||cat(x.c).n.toLowerCase().includes(q)||String(x.a).includes(q)));
  list.sort((a,b)=>b.d.localeCompare(a.d)||(b.ts||0)-(a.ts||0));
  const groups={};for(const x of list)(groups[x.d]=groups[x.d]||[]).push(x);
  const opts=`<option value="">Усі категорії</option>`+ALL.map(c=>`<option value="${c.id}"${S.qcat===c.id?' selected':''}>${c.n}</option>`).join('');
  const tot=list.reduce((s,x)=>s+(x.t==='i'?0:x.a),0);
  let body=Object.entries(groups).map(([d,xs])=>{const s=xs.reduce((a,x)=>a+(x.t==='i'?0:x.a),0);
    return`<div class="day"><span>${dayLabel(d)}${q?' '+d.slice(0,4):''}</span><span class="num">${s?'−'+money(s):''}</span></div>${xs.map(rowHtml).join('')}`}).join('');
  return demoBanner()+`<div class="tools"><label class="field"><svg class="ms" style="color:var(--muted)" aria-hidden="true"><use href="#i-search"></use></svg><input id="q" type="search" placeholder="Пошук: заправка, 500…" value="${esc(S.q)}" aria-label="Пошук"></label>
    <select class="sel" id="qcat" aria-label="Категорія">${opts}</select></div>
    ${S.qcat?`<div class="chips"><button class="chip on" data-act="clearCat">${cat(S.qcat).n} ✕</button></div>`:''}
    <section class="card">${list.length?`<h2>${q?'Знайдено за весь час':'Записи за місяць'}<span class="num" style="text-transform:none;letter-spacing:0;color:var(--ink-2)">витрати ${money0(tot)}</span></h2>`+body:emptyBox('search_off',q||S.qcat?'Нічого не знайдено':'За цей місяць записів немає')}</section>`}

function vStats(){const ym=S.month,st=stats(ym),el=elapsed(ym),n=dim(ym);
  const prevYm=addM(ym,-1);const cmpUpto=isCur(ym)?Math.min(el,dim(prevYm)):null;const pst=stats(prevYm,cmpUpto);
  const bal=st.inc-st.exp;
  const kpi=`<div class="tiles two"><div class="tile"><span>Витрати</span><b>${money0(st.exp)}</b></div><div class="tile"><span>Доходи</span><b>${money0(st.inc)}</b></div>
   <div class="tile"><span>Баланс місяця</span><b style="color:${bal<0?'var(--bad)':'var(--good)'}">${bal<0?'−':'+'}${money0(Math.abs(bal))}</b></div><div class="tile"><span>${isCur(ym)?'Прогноз витрат':'В середньому/день'}</span><b>${isCur(ym)&&el?money0(st.exp/el*n):money0(el?st.exp/el:0)}</b></div></div>`;
  const daily=`<section class="card"><h2>Витрати по днях</h2><div class="readout" id="dRead"></div><div class="chart" id="dChart"></div>
    <div class="legend"><span><i class="lb"></i>витрати за день</span><span><i class="la"></i>середнє за день</span></div></section>`;
  const L=limits();const entries=Object.entries(st.cat).sort((a,b)=>b[1]-a[1]);const mx=entries[0]?entries[0][1]:1;
  const cmpName=MG[mIdx(prevYm)];
  const catsHtml=entries.map(([id,s])=>{const c=cat(id);const lim=Number(L[id])||0;const p=pst.cat[id]||0;
    let delta='';if(p>0){const d=Math.round((s-p)/p*100);if(Math.abs(d)>=3)delta=`<span class="${d>0?'up':'down'}" style="white-space:nowrap">${d>0?'↑':'↓'} ${Math.abs(d)}% до ${cmpName}</span>`;}
    else if(pst.exp>0)delta='<span>нова категорія</span>';
    const w=lim?Math.min(s/lim,1)*100:s/mx*100;
    return`<button class="crow" data-act="drill" data-c="${id}" style="--cc:${c.col}">${icon(c)}<span class="nm">${c.n}</span><span class="am">${money0(s)}</span><span class="track"><i class="${lim&&s>lim?'over':''}" style="width:${w}%"></i></span>
    <span class="sub"><span>${Math.round(s/st.exp*100)}% · ${st.cnt[id]} ${plural(st.cnt[id],'запис','записи','записів')}${lim?` · ліміт ${money0(lim)}`:''}</span>${delta}</span></button>`}).join('');
  const cats=`<section class="card"><h2>Категорії</h2>${pst.exp>0&&entries.length?`<p class="note" style="margin:-6px 0 12px">Стрілки порівнюють ${isCur(ym)?'з тими самими днями минулого місяця':'з минулим місяцем'}.</p>`:''}${entries.length?`<div class="cats">${catsHtml}</div>`:emptyBox('pie_chart','Немає витрат за цей місяць')}</section>`;
  const sm=[];const b=budget();
  if(b>0){if(st.exp>b)sm.push(['r','error',`Бюджет ${money0(b)} перевищено на ${money0(st.exp-b)}.`]);
    else if(isCur(ym)){const plan=b*el/n;sm.push([st.exp>plan*1.05?'r':'g',st.exp>plan*1.05?'speed':'check_circle',st.exp>plan*1.05?`Витрачаєте швидше за план: на сьогодні мало б бути до ${money0(plan)}, а вже ${money0(st.exp)}.`:`Ідете за планом. До кінця місяця можна витратити ще ${money0(b-st.exp)}.`])}
    else sm.push(['g','check_circle',`Вклалися в бюджет. Залишилось ${money0(b-st.exp)} з ${money0(b)}.`])}
  else sm.push(['n','flag','Задайте місячний бюджет у «Налаштуваннях», і тут з’явиться оцінка місяця.']);
  if(st.inc>0){const sv=st.inc-st.exp;sm.push([sv>=0?'g':'r','savings',sv>=0?`Відкладено ${money0(sv)}, це ${Math.round(sv/st.inc*100)}% доходу.`:`Витрати більші за доходи на ${money0(-sv)}.`])}
  if(pst.exp>0){const d=Math.round((st.exp-pst.exp)/pst.exp*100);const per=isCur(ym)?`За ${el} ${plural(el,'день','дні','днів')} витрачено`:'Витрачено';
    sm.push([d>3?'r':d<-3?'g':'n',d>0?'trending_up':'trending_down',Math.abs(d)<=3?`${per} майже стільки ж, як ${ML[mIdx(prevYm)]}.`:`${per} на ${Math.abs(d)}% ${d>0?'більше':'менше'}, ніж ${ML[mIdx(prevYm)]}${isCur(ym)?' за ті самі дні':''}.`])}
  const sumHtml=st.exp||st.inc?`<section class="card"><h2>${isCur(ym)?'Як іде місяць':'Підсумок місяця'}</h2><ul class="sum">${sm.map(([k,i,t])=>`<li><svg class="ms ${k}" aria-hidden="true"><use href="#i-${i}"></use></svg><span>${t}</span></li>`).join('')}</ul></section>`:'';
  const ins=insights(ym,st,pst,el);
  const insHtml=ins.length?`<section class="card"><h2>Що видно з цифр</h2><ul class="insights">${ins.map(([i,t])=>`<li><svg class="ms" aria-hidden="true"><use href="#i-${i}"></use></svg><span>${t}</span></li>`).join('')}</ul></section>`:'';
  const trend=`<section class="card"><h2>Останні 6 місяців</h2><div class="readout" id="tRead"></div><div class="chart" id="tChart"></div></section>`;
  const top=[...st.list].sort((a,b)=>b.a-a.a).slice(0,5);
  const topHtml=top.length?`<section class="card"><h2>Найбільші витрати</h2>${top.map(rowHtml).join('')}</section>`:'';
  return demoBanner()+kpi+sumHtml+cats+daily+insHtml+trend+topHtml}

function insights(ym,st,pst,el){const o=[];if(!st.exp)return o;
  const e=Object.entries(st.cat).sort((a,b)=>b[1]-a[1]);
  o.push(['pie_chart',`Найбільше пішло на «${cat(e[0][0]).n}» — ${money0(e[0][1])}, це ${Math.round(e[0][1]/st.exp*100)}% усіх витрат.`]);
  let wd=0,wdn=0,we=0,wen=0;for(let d=1;d<=el;d++){const w=new Date(`${ym}-${pad(d)}T12:00`).getDay();if(w===0||w===6){we+=st.day[d-1];wen++}else{wd+=st.day[d-1];wdn++}}
  if(wen&&wdn){const a=we/wen,b=wd/wdn;if(b>0&&Math.abs(a-b)/b>.15)o.push(['calendar_month',`У вихідні ви витрачаєте в середньому ${money0(a)} на день, у будні — ${money0(b)}.`])}
  const cnt=Object.entries(st.cnt).sort((a,b)=>b[1]-a[1])[0];if(cnt&&cnt[1]>=4)o.push(['repeat',`Найчастіше: «${cat(cnt[0]).n}» — ${cnt[1]} ${plural(cnt[1],'раз','рази','разів')}, у середньому ${money0(st.cat[cnt[0]]/cnt[1])} за раз.`]);
  const md=st.day.indexOf(Math.max(...st.day));if(md>=0&&st.day[md]>0)o.push(['event',`Найдорожчий день — ${md+1} ${MG[mIdx(ym)]}: ${money0(st.day[md])}.`]);
  const L=limits();const over=Object.entries(L).filter(([id,l])=>l>0&&(st.cat[id]||0)>l);
  for(const[id,l]of over)o.push(['warning',`Ліміт на «${cat(id).n}» перевищено на ${money0(st.cat[id]-l)}.`]);
  return o}

function barPath(x,y,w,h,r){r=Math.min(r,w/2,h);if(h<=0)return'';return`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function drawCharts(){
  const ym=S.month,st=stats(ym),n=dim(ym),el=elapsed(ym);
  const box=$('#dChart');if(box){const W=Math.max(280,box.clientWidth),H=180,pl=50,pr=6,pt=10,pb=22,iw=W-pl-pr,ih=H-pt-pb;
    const mx=niceMax(Math.max(...st.day,1));const y=v=>pt+ih-(v/mx)*ih;const step=iw/n,bw=Math.max(2,Math.min(step*.66,18));
    if(S.selDay==null||S.selDay>el)S.selDay=isCur(ym)?el:(st.day.indexOf(Math.max(...st.day))+1||1);
    let g='';for(const t of[0,mx/2,mx]){g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${short(t)}</text>`}
    for(let d=1;d<=n;d++){const v=st.day[d-1];const x=pl+step*(d-1)+(step-bw)/2;
      if(v>0)g+=`<path class="b${d===S.selDay?' on':''}" d="${barPath(x,y(v),bw,ih+pt-y(v),3)}"/>`;
      if(d===1||d===n||d%5===0)g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${d}</text>`;
      if(d<=el)g+=`<rect class="hit" data-act="day" data-d="${d}" x="${pl+step*(d-1)}" y="${pt}" width="${step}" height="${ih}"/>`}
    const avg=el?st.exp/el:0;if(avg>0)g+=`<line class="avg" x1="${pl}" x2="${W-pr}" y1="${y(avg)}" y2="${y(avg)}"/>`;
    box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Витрати по днях місяця">${g}</svg>`;
    const sd=S.selDay;$('#dRead').innerHTML=sd?`<span>${sd} ${MG[mIdx(ym)]}, ${WD[new Date(`${ym}-${pad(sd)}T12:00`).getDay()]}</span><b>${money0(st.day[sd-1]||0)}</b>`:''}
  const tb=$('#tChart');if(tb){const W=Math.max(280,tb.clientWidth),H=150,pl=8,pr=8,pt=8,pb=22,iw=W-pl-pr,ih=H-pt-pb;
    const ms=[];for(let k=5;k>=0;k--)ms.push(addM(ym,-k));const vals=ms.map(m=>stats(m).exp);const mx=niceMax(Math.max(...vals,1));
    const step=iw/6,bw=Math.min(step*.56,48);if(!S.selTrend||!ms.includes(S.selTrend))S.selTrend=ym;
    let g=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"/>`;
    ms.forEach((m,i)=>{const v=vals[i];const x=pl+step*i+(step-bw)/2;const h=v/mx*ih;
      if(v>0)g+=`<path class="b${m===S.selTrend?' on':''}" d="${barPath(x,pt+ih-h,bw,h,4)}"/>`;
      g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${MS[mIdx(m)]}</text><rect class="hit" data-act="trend" data-m="${m}" x="${pl+step*i}" y="${pt}" width="${step}" height="${ih+pb}"/>`});
    tb.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Витрати за останні 6 місяців">${g}</svg>`;
    const i=ms.indexOf(S.selTrend);const valid=vals.filter(v=>v>0);const av=valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:0;
    $('#tRead').innerHTML=`<span>${MN[mIdx(S.selTrend)]}</span><b>${money0(vals[i])}</b>`+(av?`<span style="color:var(--muted);font-size:12.5px">сер. ${money0(av)}</span>`:'')}
}

function vSet(){const s=S.settings;const L=s.limits||{};
  const st=S.mode==='cloud'?['ok','Дані зберігаються у вашому акаунті Claude і однакові на телефоні, планшеті та комп’ютері.']
    :S.mode==='connecting'?['warn','Підключаюся до сховища… Записи вже зберігаються на цьому пристрої.']
    :['ok','Записи зберігаються на цьому пристрої. Щоб перенести їх на інший пристрій, збережіть «Резервну копію» і відновіть її там.'];
  return`<section class="card about"><svg viewBox="0 0 1024 1024" aria-hidden="true"><use href="#pmLogo"></use></svg><div><b>+−</b><p class="note" style="margin-top:6px">Плюс-мінус. Облік витрат і доходів</p></div></section>
  <section class="card set"><h2>Бюджет на місяць</h2><div class="inrow"><input class="inp num" id="budIn" type="number" inputmode="decimal" min="0" placeholder="Напр. 30000" value="${s.budget||''}"><button class="btn" data-act="saveBud">Зберегти</button></div>
    <p class="note">Смужка на «Огляді» покаже, скільки вже витрачено, а риска — де ви мали б бути сьогодні, щоб вкластися.</p></section>
  <section class="card set"><h2>Ліміти за категоріями</h2><p class="note">Необов’язково. Коли ліміт перевищено, смужка категорії стане червоною.</p>
    ${CATS.filter(c=>c.id!=='other').map(c=>`<label class="lim">${icon(c)}<span>${c.n}</span><input class="inp num" type="number" inputmode="decimal" min="0" placeholder="—" data-lim="${c.id}" id="lim-${c.id}" value="${L[c.id]||''}"></label>`).join('')}</section>
  <section class="card set"><h2>Збереження</h2><div class="status"><span class="dot ${st[0]}"></span><span>${st[1]}</span></div></section>
  <section class="card set"><h2>Експорт і резервна копія</h2><div class="btns"><button class="btn ghost" data-act="csv"><svg class="ms" aria-hidden="true"><use href="#i-table_view"></use></svg>Таблиця</button><button class="btn ghost" data-act="json"><svg class="ms" aria-hidden="true"><use href="#i-backup"></use></svg>Резервна копія</button></div>
    <button class="btn ghost" data-act="import"><svg class="ms" aria-hidden="true"><use href="#i-upload_file"></use></svg>Відновити з резервної копії</button>
    <p class="note">Таблиця відкривається в Excel чи Google Таблицях. Резервну копію можна завантажити назад, і записи не задвоюються.</p></section>
  <section class="card set"><h2>Як поставити на телефон чи планшет</h2>
    <b>iPhone / iPad</b><ol class="steps"><li>Відкрийте посилання на цей застосунок у Safari.</li><li>Натисніть «Поділитися» (квадрат зі стрілкою).</li><li>Оберіть «На екран Додому» і «Додати».</li></ol>
    <b>Android</b><ol class="steps"><li>Відкрийте посилання в Chrome.</li><li>Меню ⋮ → «Додати на головний екран».</li><li>Підтвердіть, і на екрані з’явиться іконка.</li></ol>
    <p class="note">Записи на кожному пристрої окремі. Час від часу зберігайте «Резервну копію», щоб нічого не втратити.</p></section>
  <section class="card set"><h2>Приклад даних</h2><p class="note">${hasReal()?'У вас уже є власні записи, тому приклад не показується.':isDemo()?'Зараз показано приклад.':'Приклад приховано.'}</p>
    ${hasReal()?'':`<button class="btn ghost" data-act="${isDemo()?'hideDemo':'showDemo'}">${isDemo()?'Сховати приклад':'Показати приклад'}</button>`}</section>`}

/* ---------- лист додавання ---------- */
let E=null,delArm=false,TPL=[];
function templates(type){if(!hasReal())return[];const from=addM(ymNow(),-3);const m=new Map();
  for(const[k,arr]of Object.entries(S.months)){if(k<from)continue;for(const x of arr){if(x.t!==type)continue;const key=x.c+'|'+(x.n||'').trim().toLowerCase()+'|'+x.a;const o=m.get(key)||{c:x.c,n:(x.n||'').trim(),a:x.a,k:0,last:''};o.k++;if(x.d>o.last)o.last=x.d;m.set(key,o)}}
  return[...m.values()].filter(o=>o.k>=2).sort((a,b)=>b.k-a.k||b.last.localeCompare(a.last)).slice(0,8)}
function openSheet(x){delArm=false;
  E=x?{id:x.id,t:x.t,amt:String(x.a).replace('.',','),c:x.c,n:x.n||'',d:x.d,manual:true,orig:x}
     :{id:null,t:'e',amt:'',c:null,n:'',d:today(),manual:false};
  $('#toast').hidden=true;$('#scrim').hidden=false;drawSheet(true)}
function closeSheet(){$('#scrim').hidden=true;$('#scrim').innerHTML='';E=null}
function amtNum(){return Number((E.amt||'0').replace(',','.'))||0}
function drawSheet(first){const list=E.t==='i'?INCS:CATS;const t=today(),y=dstr(new Date(Date.now()-864e5));
  const other=E.d!==t&&E.d!==y;
  const html=`<div class="sheet${first?' anim':''}" role="dialog" aria-modal="true" aria-label="${E.id?'Редагувати запис':'Новий запис'}">
    <div class="grab"></div>
    <div class="seg"><button data-act="type" data-v="e" class="${E.t==='e'?'on':''}">Витрата</button><button data-act="type" data-v="i" class="${E.t==='i'?'on':''}">Дохід</button></div>
    ${!E.id&&(TPL=templates(E.t)).length?`<div class="tpl" aria-label="Часті записи">${TPL.map((o,i)=>`<button class="chip" data-act="tpl" data-i="${i}" style="--cc:${cat(o.c).col}"><i></i>${esc(o.n||cat(o.c).n)} · ${money0(o.a)}</button>`).join('')}</div>`:''}
    <div class="amt${E.amt?'':' zero'}" id="amtBox">${E.amt?esc(E.amt):'0'} ₴</div>
    <label class="field" style="box-shadow:none;background:var(--bg)"><svg class="ms" style="color:var(--muted)" aria-hidden="true"><use href="#i-edit"></use></svg><input id="noteIn" placeholder="Коментар: «заправка», «АТБ»…" value="${esc(E.n)}" maxlength="80" autocomplete="off"></label>
    <div class="cgrid" id="cgrid">${list.map(c=>`<button class="cbtn${E.c===c.id?' on':''}" data-act="cat" data-v="${c.id}">${icon(c,20)}<span>${c.n}</span></button>`).join('')}</div>
    <div class="chips"><button class="chip${E.d===t?' on':''}" data-act="date" data-v="${t}">Сьогодні</button><button class="chip${E.d===y?' on':''}" data-act="date" data-v="${y}">Вчора</button>
      <span class="dstep${other?' on':''}"><button data-act="dshift" data-v="-1" aria-label="На день раніше"><svg class="ms" aria-hidden="true"><use href="#i-chevron_left"></use></svg></button><b>${Number(E.d.slice(8))} ${MG[Number(E.d.slice(5,7))-1]}${E.d.slice(0,4)!==t.slice(0,4)?' '+E.d.slice(0,4):''}</b><button data-act="dshift" data-v="1" aria-label="На день пізніше"${E.d>=t?' disabled':''}><svg class="ms" aria-hidden="true"><use href="#i-chevron_right"></use></svg></button></span></div>
    <div class="keys">${['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(k=>`<button data-act="key" data-v="${k}" aria-label="${k==='⌫'?'Стерти':k}">${k}</button>`).join('')}</div>
    <div class="hint" id="hint"></div>
    <button class="btn save" data-act="save">${E.id?'Зберегти зміни':'Зберегти'}</button>
    ${E.id?`<button class="btn danger" data-act="del">${delArm?'Натисніть ще раз, щоб видалити':'Видалити запис'}</button>`:''}
  </div>`;
  $('#scrim').innerHTML=html}
function refreshAmt(){const b=$('#amtBox');if(!b)return;b.textContent=(E.amt||'0')+' ₴';b.classList.toggle('zero',!E.amt)}
function key(k){let a=E.amt;if(k==='⌫')a=a.slice(0,-1);else if(k===','){if(!a.includes(','))a=(a||'0')+','}
  else{if(a.includes(',')&&a.split(',')[1].length>=2)return;if(a==='0')a='';if(a.replace(',','').length>=9)return;a+=k}
  E.amt=a;refreshAmt();hint('')}
function hint(t,err){const h=$('#hint');if(h){h.textContent=t;h.classList.toggle('err',!!err)}}
function saveEntry(){const a=amtNum();
  if(a<=0){const b=$('#amtBox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');hint('Введіть суму',true);return}
  if(!E.c){E.c=guess(E.n,E.t);if(!E.c){$('#cgrid').classList.add('need');hint('Оберіть категорію',true);return}}
  if(isDemo()){/* перший власний запис прибирає приклад */}
  const x={id:E.id||uid(),t:E.t,a:Math.round(a*100)/100,c:E.c,n:E.n.trim(),d:E.d,ts:E.orig?.ts||Date.now()};
  const before=E.orig?{...E.orig}:null;
  if(before)removeItem(before);
  putItem(x);
  closeSheet();S.month=x.d.slice(0,7);render();
  toast(`${before?'Оновлено':'Збережено'}: ${money(x.a)} · ${cat(x.c).n}`,()=>{removeItem(x);if(before)putItem(before);render()})}
function putItem(x){const m=x.d.slice(0,7);const arr=(S.months[m]||[]).filter(i=>i.id!==x.id);arr.push(x);S.months[m]=arr;persist(m)}
function removeItem(x){const m=x.d.slice(0,7);S.months[m]=(S.months[m]||[]).filter(i=>i.id!==x.id);persist(m)}

let tT=null;
function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button id="undo">Скасувати</button>':''}`;t.hidden=false;
  if(undo)$('#undo').onclick=()=>{undo();t.hidden=true};clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,4500)}

/* ---------- сховище ---------- */
let DB=null,ROOT=null;const chains={};let setChain=Promise.resolve();
function persist(m){
  if(S.mode==='cloud'&&ROOT){const ref=ROOT.collection('months').doc(m);
    chains[m]=(chains[m]||Promise.resolve()).then(()=>{const arr=S.months[m]||[];return arr.length?ref.set({items:arr}):ref.delete()})
      .catch(()=>{markUnsynced(m);toast('Не вдалося зберегти в акаунт. Запис залишився на пристрої, спробую ще раз пізніше.')})}
  else markUnsynced(m);
  saveLocal()}
function markUnsynced(m){if(!S.unsynced.includes(m))S.unsynced.push(m);saveLocal()}
function persistSettings(){saveLocal();if(S.mode==='cloud'&&ROOT){setChain=setChain.then(()=>ROOT.set({...S.settings})).catch(()=>{S.unsyncedSettings=true})}else S.unsyncedSettings=true}

async function connect(){
  const cl=window.claude;if(!cl||!cl.use){S.mode='local';render();return}
  try{const[db,user]=await Promise.all([cl.use('db'),cl.use('user')]);
    const id=user?await user.id():null;
    if(!db||!id){S.mode='local';render();return}
    DB=db;ROOT=db.doc(`data/users/${id}/ledger`);
    let first=true;
    ROOT.collection('months').onSnapshot(snap=>{
      const cloud={};snap.docs.forEach(d=>{const v=d.data();if(v&&Array.isArray(v.items))cloud[d.id]=v.items});
      if(first){first=false;S.mode='cloud';
        const pend=S.unsynced.slice();S.unsynced=[];
        for(const m of pend){const map=new Map((cloud[m]||[]).map(i=>[i.id,i]));for(const i of(S.months[m]||[]))map.set(i.id,i);cloud[m]=[...map.values()]}
        S.months=cloud;for(const m of pend)persist(m);
      }else S.months=cloud;
      saveLocal();safeRender();
    },()=>{S.mode='local';render()});
    ROOT.onSnapshot(d=>{const v=d.exists?d.data():null;
      if(S.unsyncedSettings){S.unsyncedSettings=false;persistSettings()}
      else if(v){S.settings={budget:0,limits:{},demoOff:false,...v};saveLocal();safeRender()}
    },()=>{});
  }catch(e){S.mode='local';render()}
}

/* ---------- експорт ---------- */
function allSorted(){return Object.values(S.months).flat().sort((a,b)=>a.d.localeCompare(b.d))}
function csv(){const q=v=>{v=String(v??'');return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return '﻿'+['Дата;Тип;Категорія;Сума;Коментар',...allSorted().map(x=>[x.d,x.t==='i'?'Дохід':'Витрата',cat(x.c).n,String(x.a).replace('.',','),x.n].map(q).join(';'))].join('\n')}
async function download(name,data,fallbackText){
  if(!hasReal()){toast('Поки що немає власних записів для експорту.');return}
  const dl=window.claude?.use?await window.claude.use('downloads'):null;
  if(dl){try{await dl.save({filename:name,data});return}catch(e){if(e&&e.code==='declined')return}}
  try{const blob=data instanceof Blob?data:new Blob([data],{type:/\.json$/.test(name)?'application/json':'text/csv;charset=utf-8'});
    const f=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})&&/iPad|iPhone|Android/i.test(navigator.userAgent)){try{await navigator.share({files:[f],title:name});return}catch(e){if(e&&e.name==='AbortError')return}}
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return}catch(e){}
  try{await navigator.clipboard.writeText(fallbackText);toast('Файл тут недоступний, тому дані скопійовано в буфер обміну.')}catch(e){toast('Не вдалося зберегти файл у цьому вікні.')}}
function importFile(f){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const arr=Array.isArray(j)?j:Array.isArray(j.items)?j.items:Object.values(j.months||{}).flat();
  let n=0;const touched=new Set();for(const x of arr){if(!x||!x.id||!x.d||!(x.a>0))continue;const m=x.d.slice(0,7);const a=(S.months[m]||[]).filter(i=>i.id!==x.id);a.push({id:String(x.id),t:x.t==='i'?'i':'e',a:Number(x.a),c:String(x.c||'other'),n:String(x.n||''),d:String(x.d).slice(0,10),ts:x.ts||0});S.months[m]=a;touched.add(m);n++}
  touched.forEach(persist);if(j.settings&&typeof j.settings==='object'){S.settings={...S.settings,...j.settings};persistSettings()}
  render();toast(`Відновлено записів: ${n}`)}catch(e){toast('Це не схоже на резервну копію з +−. Оберіть файл, збережений кнопкою «Резервна копія».')}};r.readAsText(f)}

/* ---------- події ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-tab]');
  if(e.target.id==='scrim'){closeSheet();return}
  if(!b)return;
  if(b.dataset.tab){S.view=b.dataset.tab;render();window.scrollTo(0,0);return}
  const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case'go':S.view=v;render();window.scrollTo(0,0);break;
    case'edit':{if(isDemo()){toast('Це приклад. Додайте власний запис кнопкою «+».');break}
      const x=Object.values(S.months).flat().find(i=>i.id===b.dataset.id);if(x)openSheet(x);break}
    case'type':E.t=v;if(!E.manual||!(E.t==='i'?INCS:CATS).some(c=>c.id===E.c)){E.c=guess(E.n,E.t);E.manual=false}drawSheet();break;
    case'cat':E.c=v;E.manual=true;document.querySelectorAll('.cbtn').forEach(x=>x.classList.toggle('on',x.dataset.v===v));$('#cgrid').classList.remove('need');hint('');break;
    case'date':E.d=v;drawSheet();break;
    case'dshift':{const d=new Date(E.d+'T12:00');d.setDate(d.getDate()+Number(v));const n=dstr(d);if(n<=today()){E.d=n;drawSheet()}break}
    case'key':key(v);break;
    case'save':saveEntry();break;
    case'del':if(!delArm){delArm=true;b.textContent='Натисніть ще раз, щоб видалити';break}
      {const x=E.orig;removeItem(x);closeSheet();render();toast('Запис видалено',()=>{putItem(x);render()})}break;
    case'drill':S.qcat=b.dataset.c;S.q='';S.view='list';render();window.scrollTo(0,0);break;
    case'tpl':{const o=TPL[Number(b.dataset.i)];if(!o)break;E.amt=String(o.a).replace('.',',');E.c=o.c;E.n=o.n;E.manual=true;drawSheet();hint('Перевірте суму й натисніть «Зберегти»');break}
    case'clearCat':S.qcat='';render();break;
    case'day':S.selDay=Number(b.dataset.d);drawCharts();break;
    case'trend':S.selTrend=b.dataset.m;drawCharts();break;
    case'hideDemo':S.settings.demoOff=true;persistSettings();render();break;
    case'showDemo':S.settings.demoOff=false;persistSettings();render();break;
    case'saveBud':{const n=Math.max(0,Number($('#budIn').value)||0);S.settings.budget=n;persistSettings();toast(n?`Бюджет: ${money0(n)} на місяць`:'Бюджет прибрано');break}
    case'csv':download(`плюс-мінус-${today()}.csv`,csv(),csv());break;
    case'json':{const j=JSON.stringify({app:'kopiyka',v:1,exported:today(),settings:S.settings,months:S.months},null,1);download(`плюс-мінус-копія-${today()}.json`,j,j);break}
    case'import':$('#fileIn').click();break;
  }});
$('#fab').onclick=()=>openSheet(null);
$('#mPrev').onclick=()=>{S.month=addM(S.month,-1);S.selDay=null;render()};
$('#mNext').onclick=()=>{if(S.month<ymNow()){S.month=addM(S.month,1);S.selDay=null;render()}};
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''};
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='noteIn'&&E){E.n=t.value;if(!E.manual){const g=guess(E.n,E.t);if(g!==E.c){E.c=g;document.querySelectorAll('.cbtn').forEach(x=>x.classList.toggle('on',x.dataset.v===g))}}}
  if(t.id==='q'){S.q=t.value;clearTimeout(t._t);t._t=setTimeout(()=>{const pos=t.selectionStart;render();const n=$('#q');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}},250)}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='qcat'){S.qcat=t.value;render()}
  if(t.id==='dateIn'&&E&&t.value){E.d=t.value>today()?today():t.value;drawSheet()}
  if(t.dataset.lim){const n=Math.max(0,Number(t.value)||0);S.settings.limits={...(S.settings.limits||{}),[t.dataset.lim]:n};if(!n)delete S.settings.limits[t.dataset.lim];persistSettings();toast(n?`Ліміт «${cat(t.dataset.lim).n}»: ${money0(n)}`:`Ліміт «${cat(t.dataset.lim).n}» прибрано`)}
});
document.addEventListener('keydown',e=>{if(!E)return;if(e.key==='Escape'){closeSheet();return}
  if(e.target.matches('input'))return;
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key===','||e.key==='.')key(',');else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')saveEntry()});
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(S.view==='stats')drawCharts()},150)});
/* о півночі переходимо на новий день/місяць */
setInterval(()=>{const d=today();if(d===S._day)return;const c=d.slice(0,7);if(S.month===S._day.slice(0,7))S.month=c;S.selDay=null;S._day=d;safeRender()},60000);S._day=today();

document.documentElement.lang='uk';
loadLocal();render();connect();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>

<button id="pmInstall" type="button" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:9999;padding:14px 22px;border:0;border-radius:16px;background:#23262B;color:#fff;font:600 16px/1.2 Onest,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer">⬇ Встановити на екран</button>
<script>
(function(){var ev=null,b=document.getElementById('pmInstall');
var inApp=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;if(!inApp)b.style.display='block'});
b.addEventListener('click',function(){if(!ev)return;ev.prompt();ev.userChoice.then(function(){ev=null;b.style.display='none'})});
window.addEventListener('appinstalled',function(){b.style.display='none'});})();
</script>
<div id="pmIos" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:9999;padding:14px 44px 14px 16px;border-radius:16px;background:#23262B;color:#fff;font:500 15px/1.45 Onest,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25)">Щоб поставити на екран: натисніть <b>⬆ Поширити</b> (або <b>⋯</b> → Поширити), далі <b>На екран «Додому»</b> → <b>Додати</b>.<button type="button" aria-label="Закрити" onclick="this.parentNode.style.display='none'" style="position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer">×</button></div>
<script>
(function(){var ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var inApp=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(ios&&!inApp)document.getElementById('pmIos').style.display='block';})();
</script>
</body></html>
